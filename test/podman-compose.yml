version: '3.8'

services:
  lms-c:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./content:/app/content
      - ./static:/app/static
      - ./templates:/app/templates
      - ./tokens.csv:/app/tokens.csv
    environment:
      - FLASK_ENV=development
    command: python app.py

  load-test:
    build: 
      context: .
      dockerfile: test/Dockerfile
    ports:
      - "8089:8089"
    depends_on:
      - lms-c
    volumes:
      - ./test:/app/test
    environment:
      - LOCUST_HOST=http://lms-c:5000
    command: >
      sh -c "sleep 10 && 
             locust -f /app/test/load_test.py 
             --host=http://lms-c:5000 
             --web-host=0.0.0.0"