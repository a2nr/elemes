[alembic]
script_location = migrations
prepend_sys_path = .
# sqlalchemy.url DIISI runtime dari env DATABASE_URL (lihat migrations/env.py)
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
# WARN = hanya warning/error yang tampil (output CLI rapi).
# Set ke INFO bila ingin melihat baris progres "Running upgrade X -> Y".
level = WARN
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
