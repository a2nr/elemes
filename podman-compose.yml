version: '3.8'

services:
  elemes:
    build: .
    container_name: elemes
    volumes:
      - ../content:/app/content
      - ../tokens_siswa.csv:/app/tokens.csv
      - ../assets:/app/assets
    env_file:
      - ../.env
    networks:
      lms_net:
        ipv4_address: 10.89.100.10

    # production
    # command: gunicorn --config gunicorn.conf.py "app:create_app()"

    # debug
    command: python app.py

  elemes-frontend:
    build: ./frontend
    container_name: elemes-frontend
    ports:
      - 3000:3000
    environment:
      - ORIGIN=http://localhost:3000
      - API_BACKEND=http://10.89.100.10:5000
    depends_on:
      - elemes
    networks:
      lms_net:
        ipv4_address: 10.89.100.11

  elemes-ts:
    image: docker.io/tailscale/tailscale:latest
    container_name: elemes-ts
    hostname: ${ELEMES_HOST}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_SERVE_CONFIG=/config/sinau-c-tail.json
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
    volumes:
      - ../state:/var/lib/tailscale
      - ./config:/config
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    restart: unless-stopped
    depends_on:
      - elemes-frontend
    env_file:
      - ../.env
    networks:
      lms_net:
        ipv4_address: 10.89.100.12

networks:
  lms_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.89.100.0/24
